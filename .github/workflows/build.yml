name: build

on:
  schedule:
    # 每天 03:00 UTC = 北京时间 11:00
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略版本检查, 强制重新构建"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml

permissions:
  contents: write
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up crane
        uses: imjasonh/setup-crane@v0.7

      - name: 检查上游版本
        id: check
        shell: bash
        run: |
          set -euo pipefail
          force="${{ inputs.force || 'false' }}"
          [ -f versions.txt ] || { echo "::error::versions.txt 不存在"; exit 1; }
          set -a; . ./versions.txt; set +a
          echo "当前记录: postgres=$POSTGRES_VERSION pgroonga=$PGROONGA_VERSION pgvector=$PGVECTOR_VERSION"

          need=false
          [ "$force" = "true" ] && need=true
          # 手动改了 Dockerfile / workflow 推上来 -> 总是重建
          [ "${{ github.event_name }}" = "push" ] && need=true

          # ---- 1) postgres 容器: 读 docker.io/library/postgres:latest 的 PG_VERSION env ----
          pg_full="$(crane config docker.io/library/postgres:latest | jq -r '.config.Env[] | select(startswith("PG_VERSION=")) | sub("PG_VERSION=";"")')"
          pg_latest="${pg_full%%-*}"
          echo "postgres:latest PG_VERSION=$pg_full -> 上游版本 $pg_latest"
          if [ -n "$pg_latest" ] && [ "$pg_latest" != "$POSTGRES_VERSION" ]; then
            if crane digest "docker.io/library/postgres:${pg_latest}-trixie" >/dev/null 2>&1; then
              new_base="postgres:${pg_latest}-trixie"
            elif crane digest "docker.io/library/postgres:${pg_latest}" >/dev/null 2>&1; then
              new_base="postgres:${pg_latest}"
            else
              echo "::error::postgres:latest 指向 $pg_latest, 但找不到对应 tag 的基础镜像, 请手动处理"
              exit 1
            fi
            echo "postgres 有新版本: $POSTGRES_VERSION -> $pg_latest (基础镜像 $new_base)"
            POSTGRES_VERSION="$pg_latest"
            need=true
          fi

          # ---- 2) pgvector: pgvector 不发 GitHub release, 取 tags 里最新的 v* 标签 ----
          pv_latest="$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            'https://api.github.com/repos/pgvector/pgvector/tags?per_page=100' \
            | jq -r '.[].name' | grep -E '^v[0-9]+\.[0-9]+' | sed 's/^v//' | sort -V | tail -1)"
          echo "pgvector 最新 tag -> ${pv_latest:-读取失败}"
          if [ -n "$pv_latest" ] && [ "$pv_latest" != "$PGVECTOR_VERSION" ]; then
            echo "pgvector 有新版本: $PGVECTOR_VERSION -> $pv_latest"
            PGVECTOR_VERSION="$pv_latest"
            need=true
          fi

          # ---- 3) pgroonga: 官方 apt 源 Packages 里该包的最高版本 ----
          pg_major="${POSTGRES_VERSION%%.*}"
          pkg="postgresql-${pg_major}-pgdg-pgroonga"
          pgr_latest="$(curl -fsSL 'https://packages.groonga.org/debian/dists/trixie/main/binary-amd64/Packages' \
            | awk -v pkg="$pkg" '$0=="Package: "pkg{f=1} f&&/^Version:/{print $2; f=0}' | sort -V | tail -1)"
          echo "pgroonga 最新 ($pkg) -> ${pgr_latest:-未找到}"
          if [ -z "$pgr_latest" ]; then
            echo "::error::groonga apt 源里没有 $pkg, pgroonga 可能尚未支持 PostgreSQL $pg_major, 本次不构建"
            exit 1
          fi
          if [ "$pgr_latest" != "$PGROONGA_VERSION" ]; then
            echo "pgroonga 有新版本: $PGROONGA_VERSION -> $pgr_latest"
            PGROONGA_VERSION="$pgr_latest"
            need=true
          fi

          echo "need_build=$need"
          echo "need_build=$need" >> "$GITHUB_OUTPUT"
          echo "POSTGRES_VERSION=$POSTGRES_VERSION" >> "$GITHUB_ENV"
          echo "PG_MAJOR=${POSTGRES_VERSION%%.*}" >> "$GITHUB_ENV"
          echo "PG_CODENAME=$POSTGRES_CODENAME" >> "$GITHUB_ENV"
          echo "PGROONGA_VERSION=$PGROONGA_VERSION" >> "$GITHUB_ENV"
          echo "PGVECTOR_VERSION=$PGVECTOR_VERSION" >> "$GITHUB_ENV"

      - name: 版本无变化, 跳过
        if: steps.check.outputs.need_build == 'false'
        run: echo "三个上游均无新版本, 无需重新构建"

      - name: Login to GHCR
        if: steps.check.outputs.need_build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.need_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            PG_VERSION=${{ env.POSTGRES_VERSION }}
            PG_MAJOR=${{ env.PG_MAJOR }}
            PGROONGA_VERSION=${{ env.PGROONGA_VERSION }}
            PGVECTOR_VERSION=${{ env.PGVECTOR_VERSION }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.PG_MAJOR }}
            ${{ env.IMAGE }}:${{ env.POSTGRES_VERSION }}
            ${{ env.IMAGE }}:${{ env.PG_CODENAME }}
            ${{ env.IMAGE }}:${{ env.PG_MAJOR }}-${{ env.PG_CODENAME }}
            ${{ env.IMAGE }}:${{ env.POSTGRES_VERSION }}-${{ env.PG_CODENAME }}
          provenance: false
          push: true

      - name: 更新 versions.txt
        if: steps.check.outputs.need_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > versions.txt <<'EOF'
          # postgres-pgroonga-pgvector 构建版本记录 (由 GitHub Actions 自动更新, 请勿手改)
          POSTGRES_VERSION=${{ env.POSTGRES_VERSION }}
          POSTGRES_CODENAME=${{ env.PG_CODENAME }}
          PGROONGA_VERSION=${{ env.PGROONGA_VERSION }}
          PGVECTOR_VERSION=${{ env.PGVECTOR_VERSION }}
          EOF
          if git diff --quiet versions.txt; then
            echo "versions.txt 内容无变化, 跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.txt
          git commit -m "chore: bump versions postgres=${{ env.POSTGRES_VERSION }} pgroonga=${{ env.PGROONGA_VERSION }} pgvector=${{ env.PGVECTOR_VERSION }}"
          git push
